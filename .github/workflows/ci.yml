name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22.18.0 is the floor for the test suite, not an arbitrary pin: the API
      # harness imports app/api/sikgu/route.ts directly and relies on Node
      # stripping TypeScript types natively. That is off by default through
      # 22.17 (process.features.typescript === false) and on from 22.18.0, so
      # anything lower fails every harness test with ERR_UNKNOWN_FILE_EXTENSION.
      # package.json engines says >=22.13.0, which is the app's runtime floor;
      # devEngines records the 22.18.0 test floor.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm

      # .npmrc sets strict-allow-scripts, so an install script from a package
      # not listed in package.json allowScripts fails here instead of running.
      - name: Install locked dependencies
        run: npm ci

      # Production dependencies must carry no high or critical advisory.
      # Development-only advisories are reviewed in REPAIRS.md instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # npm test chains build, typecheck and the node:test suite. They are split
      # here so a failure names the stage without needing the full run log.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: node --test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Real UI in Chromium against the local dev server with synthetic API
      # responses; see browser-tests/sikgu.spec.ts.
      - name: Browser tests
        run: npm run test:browser
        env:
          CI: "1"

      - name: Keep browser test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
