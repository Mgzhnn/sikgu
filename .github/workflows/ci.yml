name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report toolchain
        run: |
          node --version
          npm --version
          echo "runner ${{ runner.os }} ${{ runner.arch }}"

      - name: Lint
        run: npm run lint

      # npm test chains build, typecheck and the node:test suite. They are split
      # here so a failure names the stage without needing the full run log.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Temporarily one step per file: the run log needs authentication to read,
      # but step names and results do not, so this attributes the failure.
      # Collapses back to a single `node --test` once the cause is known.
      - name: Test sikgu
        run: node --test tests/sikgu.test.mjs
      - name: Test receipt-image
        if: always()
        run: node --test tests/receipt-image.test.mjs
      - name: Test repairs-api
        if: always()
        run: node --test tests/repairs-api.test.mjs
      - name: Test rendered-html
        if: always()
        run: node --test tests/rendered-html.test.mjs
      - name: Test polling
        if: always()
        run: node --test tests/polling.test.mjs
      - name: Test message-history
        if: always()
        run: node --test tests/message-history.test.mjs
      - name: Test order-estimates
        if: always()
        run: node --test tests/order-estimates.test.mjs
      - name: Test invite-continuation
        if: always()
        run: node --test tests/invite-continuation.test.mjs
      - name: Test pagination
        if: always()
        run: node --test tests/pagination.test.mjs
